<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title>صهيل — النموذج ثلاثي الأبعاد</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1F3F68;--gold:#9F8B5D;--line:#E3D8C3;--card:#fffdf8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#ECEAF0;font-family:Almarai,system-ui,sans-serif;color:#22262c}
#stage{position:fixed;inset:0}
header{position:fixed;top:14px;right:18px;left:18px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;gap:10px}
.brand{pointer-events:auto}
.brand h1{margin:0;font-size:26px;font-weight:800;color:var(--gold)}
.brand p{margin:2px 0 0;font-size:13px;color:#5b6170}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;pointer-events:auto}
button{font:inherit;cursor:pointer}
.chip{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:999px;font-size:13px;color:#22262c}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
#steps{position:fixed;top:92px;right:18px;display:flex;flex-direction:column;gap:6px;width:230px}
.st{display:flex;align-items:center;gap:8px;text-align:right;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 9px;font-size:13.5px;color:#22262c}
.st b{flex:0 0 26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-family:Arial;font-size:13px}
.st.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
#panel{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);width:min(640px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
#panel h2{margin:0 0 4px;font-size:19px;color:var(--ink)}
#panel p{margin:0;font-size:14.5px;line-height:1.7;color:#3d434c}
#panel .nav{display:flex;gap:8px;margin-top:10px}
#panel .nav button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 14px;font-size:13px}
#panel .nav .pri{background:var(--ink);color:#fff;border-color:var(--ink)}
.lbl{direction:rtl;left:0;top:0;pointer-events:auto;cursor:pointer;background:rgba(255,253,248,.95);border:1.5px solid var(--ink);color:var(--ink);font-family:Almarai,sans-serif;font-weight:700;font-size:12.5px;padding:3px 9px;border-radius:999px;white-space:nowrap;display:flex;align-items:center;gap:5px;transform:translateY(-6px)}
.lbl i{font-style:normal;background:var(--ink);color:#fff;border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-family:Arial}
.lbl.new{border-color:#C0392B;color:#C0392B}.lbl.new i{background:#C0392B}
.lbl.dim{opacity:.35}
.hide-labels .lbl{display:none}
#hint{position:fixed;bottom:178px;left:50%;transform:translateX(-50%);font-size:12px;color:#6b7080;background:rgba(255,255,255,.7);padding:4px 10px;border-radius:999px}
#phone{position:fixed;left:22px;top:84px;display:none;flex-direction:column;align-items:center;gap:8px;z-index:5}
#phone.on{display:flex}
.ph{width:240px;height:500px;border-radius:38px;border:10px solid #15171a;background:#15171a;overflow:hidden;position:relative;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.ph .scr{width:100%;height:100%;overflow-y:auto;border-radius:28px;scrollbar-width:none}.ph .scr::-webkit-scrollbar{display:none}.ph img{width:100%;display:block}
.ph .notch{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:84px;height:20px;background:#15171a;border-radius:12px;z-index:2}
.ptabs{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:300px}
.ptabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 10px;font-size:12px}
.ptabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.pcap{max-width:280px;font-size:12.5px;line-height:1.6;text-align:center;color:#3d434c;background:rgba(255,253,248,.92);border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.wifi{font-size:11.5px;color:#1F3F68;background:#E6EEF8;border-radius:999px;padding:3px 10px;direction:ltr}
@media (max-width:760px){#phone{left:50%;transform:translateX(-50%) scale(.72);transform-origin:top center;top:70px}}
@media (max-width:760px){#steps{display:none}#hint{display:none}.brand h1{font-size:21px}}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"></div>
<header>
  <div class="brand"><h1>صهيل</h1><p>المنظومة الذكية للرعاية الصحية والتموين الآلي للخيول — نموذج ثلاثي الأبعاد</p></div>
  <div class="tools">
    <button class="chip" id="bRun" aria-pressed="false">▶ تشغيل المحاكاة</button>
    <button class="chip" id="bRot" aria-pressed="false">دوران تلقائي</button>
    <button class="chip" id="bLbl" aria-pressed="true">الأسماء</button>
    <button class="chip" id="bX" aria-pressed="false">شفافية (الإسطبل والصندوق)</button>
    <button class="chip" id="bWeb" aria-pressed="false">📱 واجهة الويب</button>
    <button class="chip" id="bReset">إعادة العرض</button>
  </div>
</header>
<div id="phone"><span class="wifi">Wi-Fi: Sahil · 192.168.4.1</span><div class="ph"><div class="notch"></div><div class="scr" id="phScr"><img id="phImg" alt="واجهة الويب"></div></div><div class="ptabs" id="ptabs"></div><div class="pcap" id="pcap"></div><span class="wifi" style="direction:rtl;background:none">مرّري داخل الشاشة لرؤية الصفحة كاملة</span></div>
<div id="steps"></div>
<div id="hint">اسحبي للدوران · عجلة الماوس أو إصبعين للتقريب · زر الماوس الأيمن للتحريك</div>
<div id="panel"><h2 id="pt"></h2><p id="pd"></p>
  <div class="nav"><button id="prev">السابق</button><button class="pri" id="next">التالي</button></div></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';
import {RoundedBoxGeometry} from 'three/addons/geometries/RoundedBoxGeometry.js';

const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.05;
stage.appendChild(renderer.domElement);
const lr=new CSS2DRenderer(); lr.setSize(innerWidth,innerHeight);
Object.assign(lr.domElement.style,{position:'fixed',inset:'0',pointerEvents:'none',direction:'ltr'}); document.body.appendChild(lr.domElement);

const scene=new THREE.Scene(); scene.background=new THREE.Color('#ECEAF0');
const camera=new THREE.PerspectiveCamera(36,innerWidth/innerHeight,0.5,500);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.minDistance=18; controls.maxDistance=140; controls.maxPolarAngle=Math.PI*0.52;

scene.add(new THREE.HemisphereLight('#ffffff','#cfc9d6',1.1));
const sun=new THREE.DirectionalLight('#ffffff',2.0); sun.position.set(-25,45,35); sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048); Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40,near:1,far:150}); sun.shadow.bias=-0.0005; scene.add(sun);
const fill=new THREE.DirectionalLight('#ffffff',0.6); fill.position.set(30,20,-20); scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.ShadowMaterial({opacity:.16}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);

const M=(c,o={})=>new THREE.MeshStandardMaterial({color:c,roughness:o.r??0.55,metalness:o.m??0,transparent:o.t!=null,opacity:o.t??1,side:o.side??THREE.FrontSide,depthWrite:o.dw??true});
const white=M('#F4F3F1',{r:.7}), white2=M('#E9E7E3',{r:.7}), blue=M('#5E95CC',{r:.5}), blueD=M('#4E86BF'), black=M('#26282C',{r:.45}),
 green=M('#2E8B6B',{r:.5}), wood=M('#8C6A43',{r:.8,side:THREE.DoubleSide}), steel=M('#C9CDD2',{r:.25,m:.9}), dark=M('#3A3F46',{r:.6}),
 sensorB=M('#1F6FB2',{r:.5}), yellow=M('#E9C32E',{r:.45}), glass=M('#DDEEF6',{t:.28,r:.05,dw:false,side:THREE.DoubleSide}), water=M('#5BB4E8',{t:.75,r:.1}),
 horseM=M('#9A6A48',{r:.6}), maneM=M('#6E452C',{r:.7}), tubeM=M('#E6F2F7',{t:.55,r:.1,dw:false}), pellet=M('#C9B48A',{r:.9});

const groups={}; const G=(k)=>groups[k]??=(()=>{const g=new THREE.Group();g.name=k;scene.add(g);return g})();
function add(geo,mat,pos,k,rot){const m=new THREE.Mesh(geo,mat);m.position.set(...pos);if(rot)m.rotation.set(...rot);m.castShadow=true;m.receiveShadow=true;G(k).add(m);return m}
const box=(w,h,d,r=0.25)=>new RoundedBoxGeometry(w,h,d,3,Math.min(r,w/2,h/2,d/2)*0.999);
function frustum(tw,td,bw,bd,h){ // square-ish frustum, top at +h/2
  const g=new THREE.CylinderGeometry(1,1,h,4,1,true); const p=g.attributes.position;
  for(let i=0;i<p.count;i++){const y=p.getY(i);const x=p.getX(i),z=p.getZ(i);const top=y>0;const w=top?tw:bw,d=top?td:bd;
    // rotate 45° square to axis aligned
    const ax=(x-z)/Math.SQRT2*Math.SQRT2, az=(x+z)/Math.SQRT2*Math.SQRT2; p.setXYZ(i,Math.sign(ax)*w/2,y,Math.sign(az)*d/2);}
  g.computeVertexNormals(); return g;}

/* ---------- base ---------- */
add(box(46,1.4,30,.4),white,[0,0.7,-2],'base');
/* ---------- front housing (under auger) ---------- */
const HZ=6;                       // auger line z
add(box(19,7.8,6.4,.25),white,[-9.5,5.3,HZ],'housing');          // long white box
add(box(3.2,9.2,6.4,.25),white,[-20.6,6.0,HZ],'housing');         // left end block (servo mount)
add(box(1.2,1.0,1.6,.1),M('#9aa0a6'),[-22.3,3,HZ+1.5],'power');   // switch on side
/* ---------- servo at left end ---------- */
add(box(3.0,2.0,3.2,.2),M('#1f2125'),[-20.6,11.6,HZ],'servo');
add(new THREE.CylinderGeometry(1.1,1.1,.6,28),M('#2a2c30'),[-20.6,12.9,HZ],'servo');
for(const [dx,dz] of [[-.6,-.6],[.6,.6]]) add(new THREE.CylinderGeometry(.18,.18,.25,10),steel,[-20.6+dx,13.25,HZ+dz],'servo');
add(new THREE.CylinderGeometry(.55,.55,1.2,20),M('#f2f2f2'),[-18.6,11.6,HZ],'servo',[0,0,Math.PI/2]);
/* ---------- hopper ---------- */
const HX=-6, AY=10.8;
const skyM=M('#8FC8E2',{r:.6}), skyTop=M('#9DD0E6',{r:.6});
add(box(14,0.7,11,.15),skyTop,[HX,30,HZ],'hopper');
add(box(14.2,0.25,11.2,.05),white,[HX,29.55,HZ],'hopper');
add(frustum(12,9.5,6.4,5.2,8),skyM,[HX,25.6,HZ],'hopper');
add(box(10,0.9,7.6,.15),white,[HX,21.15,HZ],'hopper');
add(box(5.8,2.4,4.6,.2),black,[HX,19.5,HZ],'hopper');
add(frustum(4.4,3.8,2.6,2.3,4.6),green,[HX,16.0,HZ],'hopper');
function hcsr04(k,pos,rot){const g=new THREE.Group();
  const pcb=new THREE.Mesh(box(4.6,0.25,2.0,.08),sensorB);g.add(pcb);
  for(const dx of[-1.25,1.25]){const c=new THREE.Mesh(new THREE.CylinderGeometry(.82,.82,1.1,32),steel);c.position.set(dx,.65,0);g.add(c);
    const mesh=new THREE.Mesh(new THREE.CylinderGeometry(.62,.62,0.02,32),M('#7d858e',{r:.9}));mesh.position.set(dx,1.21,0);g.add(mesh);}
  const x=new THREE.Mesh(box(.6,.3,.45,.05),M('#e8e8e8'));x.position.set(0,.3,-.6);g.add(x);
  for(let i=0;i<4;i++){const p=new THREE.Mesh(new THREE.BoxGeometry(.12,.12,.9),M('#d4af37',{m:.6}));p.position.set(-.45+i*.3,-.05,1.4);g.add(p);}
  g.traverse(o=>{o.castShadow=true});
  if(rot)g.rotation.set(...rot); g.position.set(...pos); G(k).add(g); return g;}
hcsr04('feedSensor',[HX,30.45,HZ-0.3]);
/* ---------- auger T-pipe ---------- */
add(new THREE.CylinderGeometry(1.5,1.5,12,40),black,[-1.5,AY,HZ],'auger',[0,0,Math.PI/2]);
add(new THREE.CylinderGeometry(1.3,1.3,2.8,32),black,[HX,AY+2,HZ],'auger');
add(new THREE.CylinderGeometry(1.8,1.8,3.0,40),dark,[5.4,AY,HZ],'auger',[0,0,Math.PI/2]);
add(new THREE.CylinderGeometry(1.0,1.0,.9,24),green,[-7.9,AY,HZ],'auger',[0,0,Math.PI/2]);
add(new THREE.CylinderGeometry(.22,.22,9.6,16),steel,[-13.1,AY,HZ],'auger',[0,0,Math.PI/2]);
const screw=new THREE.Group();
{const pts=[];for(let i=0;i<=220;i++){const t=i/220;const a=t*Math.PI*2*9;pts.push(new THREE.Vector3(-7+t*12.8,Math.cos(a)*1.05,Math.sin(a)*1.05));}
 screw.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),400,.16,6),M('#d9d4c8')));
 screw.position.set(0,AY,HZ);G('auger').add(screw);}
/* ---------- stall (open front, brown left wall) ---------- */
const SX0=2.5,SX1=19,SZ0=-7,SZ1=11,SH=13.5;
add(box(SX1-SX0,SH,0.5,.1),white,[(SX0+SX1)/2,1.4+SH/2,SZ0],'stall');                 // back
add(box(0.5,SH,SZ1-SZ0,.1),wood,[SX0,1.4+SH/2,(SZ0+SZ1)/2],'stall');                  // left (wood)
// right wall with window
{const s=new THREE.Shape();const D=SZ1-SZ0;s.moveTo(0,0);s.lineTo(D,0);s.lineTo(D,SH);s.lineTo(0,SH);s.lineTo(0,0);
 const h=new THREE.Path();h.moveTo(4,7);h.lineTo(12,7);h.lineTo(12,10.5);h.lineTo(4,10.5);h.lineTo(4,7);s.holes.push(h);
 const g=new THREE.ExtrudeGeometry(s,{depth:.5,bevelEnabled:false});const m=add(g,white,[SX1+.25,1.4,SZ1],'stall',[0,Math.PI/2,0]);}
add(box(0.35,6.5,0.6,.05),white,[SX1-1.2,7.6,4.6],'stall',[0.5,0,0]);                   // slanted stick
add(box(SX1-SX0,0.3,SZ1-SZ0,.05),M('#f7f7f7'),[(SX0+SX1)/2,1.55,(SZ0+SZ1)/2],'stall');
add(box(0.4,SH-1,5.5,.05),wood,[SX1+0.5,0.9+SH/2,SZ1+2.4],'stall',[0,-0.5,0]);       // door leaf (front-right)
/* ---------- feed tray (black) under auger outlet ---------- */
add(box(3.6,3.0,3.6,.2),M('#25272b',{r:.6}),[5.4,3.0,6.6],'tray');
const pel=new THREE.InstancedMesh(new THREE.SphereGeometry(.2,8,6),pellet,90);
{const d=new THREE.Object3D();for(let i=0;i<90;i++){d.position.set(5.4+(Math.random()-.5)*2.8,4.55+Math.random()*.3,6.6+(Math.random()-.5)*2.8);d.updateMatrix();pel.setMatrixAt(i,d.matrix);}G('tray').add(pel);}
/* ---------- water bottle on green tripod (behind) ---------- */
const BX=1.5,BZ=-11.5;
for(const a of [0,2.1,4.2]) add(box(2.2,4.2,0.8,.15),green,[BX+Math.cos(a)*2.6,3.5,BZ+Math.sin(a)*2.6],'pump',[0,-a+Math.PI/2,0]);
add(new THREE.SphereGeometry(3.6,40,24),glass,[BX,9.6,BZ],'pump');
add(new THREE.CylinderGeometry(3.4,3.6,6,40,1,true),glass,[BX,12.6,BZ],'pump');
const bottleWater=add(new THREE.SphereGeometry(3.3,40,20,0,Math.PI*2,Math.PI*0.45,Math.PI*0.55),water,[BX,9.6,BZ],'pump');
add(new THREE.CylinderGeometry(2.1,3.2,2.0,40),glass,[BX,16.4,BZ],'pump');
add(new THREE.CylinderGeometry(2.6,2.6,1.6,40),yellow,[BX,18.0,BZ],'pump');
add(new THREE.CylinderGeometry(2.4,2.4,1.6,40),white,[BX,19.6,BZ],'pump');
add(new THREE.CylinderGeometry(2.2,2.4,6.8,40),black,[BX,23.7,BZ],'pump');
add(new THREE.SphereGeometry(2.2,40,20,0,Math.PI*2,0,Math.PI/2),black,[BX,27.1,BZ],'pump');
{const c=new THREE.CatmullRomCurve3([new THREE.Vector3(BX+2.1,25,BZ),new THREE.Vector3(BX+4.5,25.6,BZ),new THREE.Vector3(BX+5.2,24.2,BZ)]);
 add(new THREE.TubeGeometry(c,30,.28,12),steel,[0,0,0],'pump');}
const CUP=[12.5,1.7,2.5];
{const c=new THREE.CatmullRomCurve3([new THREE.Vector3(BX+5.2,24,BZ),new THREE.Vector3(BX+8,21,BZ+1),new THREE.Vector3(13,17,SZ0-1.2),new THREE.Vector3(13,15.2,SZ0+0.6),new THREE.Vector3(12.8,8.5,1.2),new THREE.Vector3(12.6,6.2,2.0)]);
 add(new THREE.TubeGeometry(c,90,.32,12),tubeM,[0,0,0],'hose');}
/* water cup (clear) */
add(new THREE.CylinderGeometry(2.3,2.0,3.8,40,1,true),glass,[CUP[0],CUP[1]+1.9,CUP[2]],'cup');
add(new THREE.CylinderGeometry(2.0,2.0,.15,40),glass,[CUP[0],CUP[1]+.08,CUP[2]],'cup');
const cupWater=add(new THREE.CylinderGeometry(2.1,1.98,2.4,40),water,[CUP[0],CUP[1]+1.3,CUP[2]],'cup');
add(new THREE.TorusGeometry(2.3,.08,8,48),M('#cfe6f1',{t:.7}),[CUP[0],CUP[1]+3.8,CUP[2]],'cup',[Math.PI/2,0,0]);
/* water level sensor on bracket from back wall, facing down over the cup */
add(box(1.6,1.2,0.4,.08),white2,[CUP[0],12.9,SZ0+0.45],'waterSensor');
add(box(1.6,0.35,CUP[2]-SZ0,.08),white2,[CUP[0],12.5,(SZ0+CUP[2])/2+0.2],'waterSensor');
hcsr04('waterSensor',[CUP[0],12.1,CUP[2]],[Math.PI,0,0]);
const beam=add(new THREE.CylinderGeometry(0.6,2.1,12.1-CUP[1]-3.5,32,1,true),M('#C0392B',{t:.12,dw:false,side:THREE.DoubleSide}),[CUP[0],(12.1+CUP[1]+3.5)/2,CUP[2]],'waterSensor');
beam.castShadow=false;
/* ---------- electronics at back ---------- */
const EX=-12,EZ=-9;
add(box(5.4,2.4,3.6,.2),white,[EX,2.6,EZ],'esp');
add(box(5.2,.35,2.6,.08),M('#1D1F24'),[EX,4.0,EZ],'esp');
add(box(2.4,.35,1.6,.05),M('#c4c8ce',{m:.6}),[EX+1.0,4.3,EZ],'esp');
for(let i=0;i<15;i++){add(new THREE.BoxGeometry(.12,.12,.12),M('#d4af37',{m:.6}),[EX-2.3+i*.33,4.25,EZ-1.15],'esp');add(new THREE.BoxGeometry(.12,.12,.12),M('#d4af37',{m:.6}),[EX-2.3+i*.33,4.25,EZ+1.15],'esp');}
add(new THREE.CylinderGeometry(.9,.9,1.2,28),black,[EX-1.6,4.9,EZ-0.2],'buzzer');
add(new THREE.CylinderGeometry(.15,.15,.2,10),M('#555'),[EX-1.6,5.6,EZ-0.2],'buzzer');
function relay(x,z,r){add(box(3.4,.3,2.2,.05),M('#2E6FBF'),[x,1.6,z],'relay',[0,r,0]);add(box(1.6,1.4,1.4,.1),M('#1f4fa0'),[x+.4,2.5,z],'relay',[0,r,0]);add(box(.9,.8,1.2,.05),M('#2b7bd8'),[x-1.2,2.2,z],'relay',[0,r,0]);}
relay(-15.5,-13,0.3); relay(-10,-14.2,-0.2);
/* wires */

const tour=[{t:'منظومة «صهيل»',d:'نموذج المنظومة الذكية: خزان علف وبريمة للتغذية الآلية، ومضخة لتعبئة الماء، وحساسان فوق صوتيان، ومتحكم ESP32 مع ذكاء اصطناعي يتعلّم نمط أكل وشرب الخيل. اضغطي «التالي» أو أي اسم على النموذج.',cam:[-10,38,78],tg:[0,12,0]},...parts,
 {k:'esp',t:'واجهة الويب على الجوال',d:'يتصل الجوال بشبكة Wi-Fi يوفّرها ESP32 دون إنترنت ويفتح العنوان 192.168.4.1: صفحة دخول، ثم لوحة تحكم تعرض مستوى العلف والماء وموعد الوجبة القادمة، ويمكن تقديم وجبة فوراً.',cam:[-26,22,-34],tg:[-12,3,-9],phone:['login','home','usage','users','settings']},
 {k:'buzzer',t:'الذكاء الاصطناعي والتنبيهات',d:'تعرض الواجهة تحليل نموذج Isolation Forest لكل يوم: الحالة ودرجة الشذوذ وسبب التنبيه. وعند تراجع الشرب عن نمط الخيل يظهر تنبيه في الواجهة ويصدر البازر صوتاً من الجهاز.',cam:[-24,20,-30],tg:[-13.6,4,-9],phone:['ai','health','alerts']}];
const stepsEl=document.getElementById('steps');
tour.forEach((p,i)=>{const b=document.createElement('button');b.className='st';b.innerHTML=`<b>${i||'★'}</b>${i?p.t.replace(' HC-SR04',''):'نظرة عامة'}`;b.onclick=()=>go(i);stepsEl.appendChild(b);});

let cur=0, fly=null;
const all=Object.values(groups);
function highlight(k){
  for(const [name,g] of Object.entries(groups)){g.traverse(o=>{if(!o.isMesh)return;const mats=Array.isArray(o.material)?o.material:[o.material];
    o.material=o.userData.orig??=o.material; if(k&&name!==k&&name!=='base'&&!(k==='battery'&&name==='housing')){ if(!o.userData.dim){o.userData.dim=o.material.clone();o.userData.dim.transparent=true;o.userData.dim.opacity=Math.min(o.material.opacity,.28);o.userData.dim.depthWrite=false;} o.material=o.userData.dim;}
    if((xray&&name==='stall'||(xray||k==='battery')&&name==='housing')&&o.material===o.userData.orig){ o.material=o.userData.x??=(()=>{const m=o.material.clone();m.transparent=true;m.opacity=.22;m.depthWrite=false;return m})();}
  });}
  labels.forEach((el,i)=>el.classList.toggle('dim',!!k&&parts[i].k!==k));
}
function go(i){cur=(i+tour.length)%tour.length;const p=tour[cur];
  document.getElementById('pt').textContent=(cur?cur+'. ':'')+p.t; document.getElementById('pd').textContent=p.d;
  [...stepsEl.children].forEach((b,j)=>b.classList.toggle('on',j===cur));
  highlight(cur?p.k:null);
  webOn=!!p.phone; document.getElementById('bWeb').setAttribute('aria-pressed',webOn); showPhone(p.phone||null);
  fly={t:0,fc:camera.position.clone(),ft:controls.target.clone(),tc:new THREE.Vector3(...p.cam),tt:new THREE.Vector3(...p.tg)};}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
addEventListener('keydown',e=>{if(e.key==='ArrowLeft')go(cur+1);if(e.key==='ArrowRight')go(cur-1);});

const tog=(id,f)=>{const b=document.getElementById(id);b.onclick=()=>{const v=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',v);f(v)}};
let running=false, xray=false, webOn=false;
document.getElementById('bWeb').onclick=()=>{webOn=!webOn;document.getElementById('bWeb').setAttribute('aria-pressed',webOn);showPhone(webOn?['login','home','health','ai','usage','alerts','users','settings']:null,'home');};
tog('bRot',v=>controls.autoRotate=v); controls.autoRotateSpeed=1.2;
tog('bLbl',v=>document.body.classList.toggle('hide-labels',!v));
tog('bX',v=>{xray=v;highlight(cur?tour[cur].k:null)});
tog('bRun',v=>{running=v;document.getElementById('bRun').textContent=v?'⏸ إيقاف المحاكاة':'▶ تشغيل المحاكاة'});
document.getElementById('bReset').onclick=()=>go(0);

camera.position.set(-10,38,78); controls.target.set(0,12,0); go(0);

// drops
const drops=[];for(let i=0;i<10;i++){const d=new THREE.Mesh(new THREE.SphereGeometry(.18,8,6),water);d.visible=false;scene.add(d);drops.push(d);}
const clock=new THREE.Clock(); let lvl=0.85, pumpOn=false;
function loop(){const dt=Math.min(clock.getDelta(),.05);
  if(fly){fly.t=Math.min(1,fly.t+dt*1.1);const e=1-Math.pow(1-fly.t,3);camera.position.lerpVectors(fly.fc,fly.tc,e);controls.target.lerpVectors(fly.ft,fly.tt,e);if(fly.t>=1)fly=null;}
  if(running){screw.rotation.x+=dt*5;
    lvl-= pumpOn? -dt*0.25 : dt*0.06; if(lvl<0.35)pumpOn=true; if(lvl>0.92)pumpOn=false;
    beam.material.opacity=.10+.08*Math.sin(clock.elapsedTime*8);
  }
  cupWater.scale.y=Math.max(.05,lvl); cupWater.position.y=CUP[1]+0.15+1.2*lvl;
  drops.forEach((d,i)=>{d.visible=running&&pumpOn;const t=((clock.elapsedTime*1.6+i/drops.length)%1);d.position.set(12.6,6.0-t*(6.0-(CUP[1]+0.2+2.4*lvl)),2.0);});
  controls.update(); renderer.render(scene,camera); lr.render(scene,camera); requestAnimationFrame(loop);}
loop();
function vo(){const off=innerWidth>760?120:0;camera.setViewOffset(innerWidth+off*2,innerHeight,off*2,0,innerWidth,innerHeight);}
vo();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;vo();camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);lr.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
